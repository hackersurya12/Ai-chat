# AI Chat Website - Nginx Configuration
# Place in /etc/nginx/sites-available/ai-chat and symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name ai-chat.example.com www.ai-chat.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai-chat.example.com www.ai-chat.example.com;

    root /var/www/ai-chat/website-php;
    index index.php index.html;

    # SSL Configuration (use Let's Encrypt or your certificates)
    ssl_certificate /etc/letsencrypt/live/ai-chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://dwxgrmahesmacnjfvegy.supabase.co https://identitytoolkit.googleapis.com;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json image/svg+xml;

    # Browser Caching
    location ~* \.(png|jpg|jpeg|webp|svg|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PHP Files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param APP_ENV production;
    }

    # Clean URLs - remove .php extension
    location / {
        try_files $uri $uri/ $uri.php$is_args$args;
    }

    # Sitemap
    location = /sitemap.xml {
        rewrite ^/sitemap\.xml$ /sitemap.php last;
    }

    # Robots
    location = /robots.txt {
        rewrite ^/robots\.txt$ /robots.php last;
    }

    # Redirect .php URLs to clean
    location ~ \.php$ {
        if ($request_uri ~ ^(.+)\.php) {
            return 301 $1;
        }
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ ^/(config\.php|composer\.json|composer\.lock|README\.md) {
        deny all;
    }

    # Prevent directory listing
    autoindex off;
}